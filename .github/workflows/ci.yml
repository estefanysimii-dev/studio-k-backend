name: Studio K backend CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate Wispbyte preparation
        run: |
          node --check deploy/wisp/install-user-tools.mjs
          node --check deploy/wisp/converter-smoke.mjs
          node --check deploy/wisp/host-preflight.mjs
          node deploy/wisp/install-user-tools.mjs --self-test
          sh -n deploy/wisp/start.sh
      - run: npm test
